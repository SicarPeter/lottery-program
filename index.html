<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>標車酷線上抽獎系統 - 抽籤箱版</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #191935;
      --accent: #D9F107;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: white;
      padding: 20px;
    }
    .cta-btn {
      background: var(--accent);
      color: #191935;
      font-weight: 900;
      padding: 12px 24px;
      border-radius: 12px;
    }
    .glass {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(8px);
      border-radius: 16px;
    }
  </style>
</head>

<body>
<div class="max-w-6xl mx-auto">

  <h1 class="text-4xl font-black text-center mb-8">標車酷線上抽籤箱</h1>

  <!-- 設定頁 -->
  <section id="page-settings" class="glass p-6">
    <h2 class="text-2xl font-bold mb-4">活動設定</h2>
    <textarea id="names-input" rows="10"
      class="w-full p-4 bg-black/30 rounded-lg"
      placeholder="每行一位：暱稱｜車款"></textarea>

    <div class="flex justify-between items-center mt-4">
      <span>人數：<span id="total-count" class="text-yellow-300 font-bold">0</span></span>
      <button class="cta-btn" onclick="toRafflePage()">準備抽獎</button>
    </div>
  </section>

  <!-- 抽獎頁 -->
  <section id="page-raffle" class="hidden glass p-6 mt-6 text-center">
    <h2 id="current-prize" class="text-2xl font-black mb-4"></h2>
    <p id="status-text" class="mb-4"></p>
    <button id="draw-btn" class="cta-btn" onclick="handleControlClick()">開始抽獎</button>
  </section>

</div>

<script>
/* ================== 設定 ================== */

const TOTAL_QUOTA = 34;

const PRIZE_TIERS = [
  { tier: '伍獎', quota: 8 },
  { tier: '肆獎', quota: 5 },
  { tier: '參獎', quota: 10 },
  { tier: '貳獎', quota: 10 },
  { tier: '頭獎', quota: 1 }
];

const FIXED_WINNERS = {
  '頭獎': ['Cheng｜2014 Nissan Sentra'],
  '貳獎': ['標車小助手｜2015 Toyota wish'],
  '參獎': ['許豪｜2017 Lexus NX'],
  '肆獎': ['Kimi1012｜2022 BMW 3 Series Touring'],
  '伍獎': ['標車小助手｜2018 Toyota RAV4']
};

/* ================== 狀態 ================== */

let appState = {
  originalNames: [],
  pool: [],
  winners: [],
  prizeIndex: 0
};

/* ================== 工具 ================== */

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

/* ================== 流程 ================== */

function toRafflePage() {
  const input = document.getElementById('names-input').value.trim();
  if (!input) return alert('請先輸入名單');

  appState.originalNames = [...new Set(input.split('\n').map(v => v.trim()))];

  // 收集所有指定名單
  const fixedAll = Object.values(FIXED_WINNERS).flat();

  // 抽獎池排除指定名單
  appState.pool = shuffle(
    appState.originalNames.filter(n => !fixedAll.includes(n))
  );

  appState.winners = [];
  appState.prizeIndex = 0;

  document.getElementById('page-settings').classList.add('hidden');
  document.getElementById('page-raffle').classList.remove('hidden');

  updatePrizeUI();
}

function updatePrizeUI() {
  const prize = PRIZE_TIERS[appState.prizeIndex];
  document.getElementById('current-prize').textContent =
    `${prize.tier}（${prize.quota} 名）`;
  document.getElementById('status-text').textContent = '準備抽獎';
}

function handleControlClick() {
  const prize = PRIZE_TIERS[appState.prizeIndex];
  const already = appState.winners.filter(w => w.tier === prize.tier).length;

  if (already >= prize.quota) {
    appState.prizeIndex++;
    if (appState.prizeIndex >= PRIZE_TIERS.length) {
      alert('🎉 抽獎完成');
      console.table(appState.winners);
      return;
    }
    updatePrizeUI();
    return;
  }

  let name;
  const isFirst = already === 0;
  const fixed = FIXED_WINNERS[prize.tier]?.[0];

  if (isFirst && fixed) {
    if (!appState.originalNames.includes(fixed)) {
      alert(`指定名單不存在：${fixed}`);
      return;
    }
    name = fixed;
  } else {
    name = appState.pool.shift();
  }

  appState.winners.push({ tier: prize.tier, name });

  document.getElementById('status-text').textContent =
    `🎉 ${name} 中 ${prize.tier}`;

  if (already + 1 >= prize.quota) {
    setTimeout(() => {
      appState.prizeIndex++;
      if (appState.prizeIndex < PRIZE_TIERS.length) {
        updatePrizeUI();
      } else {
        alert('🎊 全部抽完');
        console.table(appState.winners);
      }
    }, 800);
  }
}

/* ================== 初始化 ================== */

document.getElementById('names-input').addEventListener('input', e => {
  document.getElementById('total-count').textContent =
    e.target.value.split('\n').filter(Boolean).length;
});
</script>
</body>
</html>
